info:
  summary: Animated Horse-drawn Carriage Automata Pack 6
  description: |-
    Here comes the sixth instalment of horse-drawn carriages, to replace the last remaining Maxis cars with 3 Victoria carriages, a caleche coach, 5 phaetons, a Royal Mail van, and a van to override the "escape beater".  It also replaces Maxis moving vans with a wagon and a bigger carriage drawn by draft horses. If you notice, the draft horses are larger and more robust and hairy than the standard ones.   
    The carriages of this pack are all articulated. As usual, the coachmen and passengers sport Victorian attire and faces that you can't see at normal zoom levels but still give your sims some individuality.   
    The car automata replacement is now complete!

    To replace all Maxis vehicles, install the complete horse-drawn set: `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-1`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-2`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-3`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-4`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-5-civic-vehicles`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-6`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-7-freight`, `pkg=justforfun:animated-london-mounted-police-automata`, `pkg=justforfun:animated-horse-riding-gentlemen-automata` and `pkg=justforfun:automated-horse-drawn-carriage-automata-patch`.

    Enjoy your rides!

    justforfun
  author: justforfun
