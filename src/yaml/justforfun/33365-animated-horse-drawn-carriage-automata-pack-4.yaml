info:
  summary: Animated Horse-Drawn Carriage Automata Pack 4
  description: |-
    Fourth instalment of Victorian horse-drawn carriages, to replace yet another number of Maxis car automata.

    The carriages are as always animated and articulated, and feature working people carrying crates, flour bags, coal, barrels, firewood, laundry, etc.  The pack contains 6 wagons, 3 vans, 2 dog carts, 1 governess cart, and 5 floats.

    To replace all Maxis vehicles, install the complete horse-drawn set: `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-1`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-2`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-3`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-4`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-5-civic-vehicles`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-6`, `pkg=justforfun:animated-horse-drawn-carriage-automata-pack-7-freight`, `pkg=justforfun:animated-london-mounted-police-automata`, `pkg=justforfun:animated-horse-riding-gentlemen-automata` and `pkg=justforfun:automated-horse-drawn-carriage-automata-patch`.

    If you like them please review, and happy 2020 to everybody! Oops, I mean 1870!

    justforfun
