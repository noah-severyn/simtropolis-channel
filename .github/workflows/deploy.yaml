name: Deploy channel

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/yaml/**'
    branches:
      - main

jobs:
  build:
    uses: memo33/sc4pac-actions/.github/workflows/sc4pac-channel.yaml@main
    with:
      path: src/yaml
      channel-label: ${{ vars.CHANNEL_LABEL }}
      deploy-repository: sebamarynissen/simtropolis-channel
      sc4pac-tools-submodule: ''   # whatever it uses today
      skip-pages-upload: true # Allows us to build the Coverage Report
    secrets:
      stex-api-key: ${{ secrets.STEX_API_KEY }}
      sc4pac-simtropolis-token: ${{ secrets.SC4PAC_SIMTROPOLIS_TOKEN }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v6
      with:
        ref: main
        persist-credentials: false
    - name: Download built pages
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.pages-artifact-name }}
        path: tmp_gh-pages
    - name: Assemble Pages content
      run: |
        mv tmp_gh-pages/channel/* tmp_gh-pages/
        rmdir tmp_gh-pages/channel
        cp -r docs tmp_gh-pages/docs
    - name: Install dependencies
      run: npm ci
    - name: Update coverage report
      run: node scripts/scan-coverage.js
      continue-on-error: true
      env:
        STEX_API_KEY: ${{ secrets.STEX_API_KEY }}
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: tmp_gh-pages
    - id: deployment
      uses: actions/deploy-pages@v4
    permissions:
      pages: write
      id-token: write
